<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系方式 · 麋鹿</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0C0C0C; --text: #C8C8C6; --text-dim: #6B6B68;
    --text-bright: #F5F5F3; --line: #1F1F1E; --line-light: #2A2A28;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; font-weight: 350;
    line-height: 1.6; letter-spacing: 0.01em;
  }
  body::after {
    content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 32px 56px;
  }
  .nav-inner { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; }
  .nav-logo { font-size: 15px; font-weight: 450; color: var(--text-bright); text-decoration: none; letter-spacing: 0.04em; }
  .nav-links { display: flex; gap: 40px; list-style: none; }
  .nav-links a { text-decoration: none; color: var(--text-dim); font-size: 14px; font-weight: 380; letter-spacing: 0.05em; transition: color 0.3s; }
  .nav-links a:hover { color: var(--text-bright); }

  .page { max-width: 700px; margin: 0 auto; padding: 160px 56px 80px; }

  .back-link { font-size: 13px; color: var(--text-dim); text-decoration: none; display: inline-block; margin-bottom: 48px; transition: color 0.2s; }
  .back-link:hover { color: var(--text-bright); }

  h1 { font-size: clamp(40px, 5vw, 60px); font-weight: 300; color: var(--text-bright); line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 8px; }
  .sub { font-size: 14px; color: var(--text-dim); margin-bottom: 12px; }
  .sub-hint {
    font-size: 11px; color: #4A4A47; margin-bottom: 48px;
    display: flex; align-items: center; gap: 8px;
  }
  .sub-hint .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #4A4A47;
    animation: hintPulse 2s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
  }

  /* ── Button list ── */
  .btn-list { display: flex; flex-direction: column; gap: 6px; }

  .contact-btn {
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 22px 28px;
    background: #111110; border: 1px solid var(--line);
    color: var(--text-bright); font-size: 15px; font-weight: 380;
    cursor: pointer; letter-spacing: 0.04em;
    transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
    text-align: left; font-family: inherit;
    position: relative; overflow: hidden;
  }
  /* ── Subtle inner shimmer on hover ── */
  .contact-btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.015), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s cubic-bezier(0.16,1,0.3,1);
  }
  .contact-btn:hover::before { transform: translateX(100%); }

  .contact-btn:hover {
    border-color: #444;
    background: #161614;
    padding-left: 36px;
  }
  .contact-btn:active {
    transform: scale(0.99);
    transition: transform 0.1s ease;
  }

  /* ── Pulsing dot indicator ── */
  .contact-btn .indicator {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
    animation: btnPulse 2.4s ease-in-out infinite;
  }
  .contact-btn:nth-child(1) .indicator { animation-delay: 0s; }
  .contact-btn:nth-child(2) .indicator { animation-delay: 0.6s; }
  .contact-btn:nth-child(3) .indicator { animation-delay: 1.2s; }
  .contact-btn:nth-child(4) .indicator { animation-delay: 1.8s; }

  @keyframes btnPulse {
    0%, 100% { opacity: 0.3; box-shadow: 0 0 0 0 rgba(107,107,104,0.3); }
    50% { opacity: 1; box-shadow: 0 0 0 6px rgba(107,107,104,0); }
  }
  .contact-btn:hover .indicator {
    animation: none; opacity: 1;
    background: var(--text-bright);
  }

  .contact-btn .platform-badge {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 5px 14px; border: 1px solid #2A2A28; color: var(--text-dim);
    min-width: 82px; text-align: center; flex-shrink: 0;
    transition: all 0.3s;
  }
  .contact-btn:hover .platform-badge {
    border-color: #444; color: var(--text-bright);
  }

  .contact-btn .btn-label { flex: 1; }

  .contact-btn .arrow {
    font-size: 16px; color: var(--text-dim);
    transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
    flex-shrink: 0;
  }
  .contact-btn:hover .arrow {
    transform: translateX(6px);
    color: var(--text-bright);
  }

  /* ── Staggered entrance ── */
  .btn-stagger {
    opacity: 0; transform: translateX(-16px);
    transition: opacity 0.6s cubic-bezier(0.16,1,0.3,1),
                transform 0.6s cubic-bezier(0.16,1,0.3,1);
  }
  .btn-stagger.visible { opacity: 1; transform: translateX(0); }
  .btn-stagger:nth-child(1) { transition-delay: 0.05s; }
  .btn-stagger:nth-child(2) { transition-delay: 0.15s; }
  .btn-stagger:nth-child(3) { transition-delay: 0.25s; }
  .btn-stagger:nth-child(4) { transition-delay: 0.35s; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }

  .modal-box {
    background: #141413; border: 1px solid var(--line-light);
    padding: 48px; max-width: 440px; width: 90%;
    text-align: center;
    transform: translateY(20px) scale(0.97);
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
  }
  .modal-overlay.open .modal-box { transform: translateY(0) scale(1); }

  .modal-box .platform-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--text-dim); margin-bottom: 28px;
    padding: 5px 16px; border: 1px solid #2A2A28; display: inline-block;
  }
  .modal-box img {
    max-width: 280px; width: 100%; height: auto;
    display: block; margin: 0 auto 20px;
    border-radius: 2px;
    animation: imgReveal 0.5s 0.15s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes imgReveal {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-box .modal-text { font-size: 16px; color: var(--text-bright); margin-bottom: 6px; }
  .modal-box .modal-hint { font-size: 12px; color: var(--text-dim); }
  .modal-close {
    margin-top: 32px; padding: 11px 36px;
    background: none; border: 1px solid #333; color: var(--text-dim);
    font-size: 13px; cursor: pointer; letter-spacing: 0.04em;
    transition: all 0.25s; font-family: inherit;
  }
  .modal-close:hover { color: var(--text-bright); border-color: var(--text-bright); background: rgba(255,255,255,0.03); }

  /* ── Ripple on click ── */
  .ripple {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.06);
    transform: scale(0);
    animation: ripple 0.6s ease-out forwards;
    pointer-events: none;
  }
  @keyframes ripple {
    to { transform: scale(4); opacity: 0; }
  }

  footer { max-width: 1400px; margin: 0 auto; padding: 40px 56px 48px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 11px; color: #3D3D3B; letter-spacing: 0.04em; }

  .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1), transform 0.8s cubic-bezier(0.16,1,0.3,1); }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  @media (max-width: 768px) {
    nav { padding: 20px 24px; }
    .nav-links { gap: 20px; }
    .nav-links a { font-size: 12px; }
    .page { padding: 120px 24px 60px; }
    .contact-btn { padding: 16px 20px; font-size: 14px; }
    .contact-btn:hover { padding-left: 24px; }
    .modal-box { padding: 32px 24px; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo">麋鹿</a>
    <ul class="nav-links">
      <li><a href="works.html">作品</a></li>
      <li><a href="plugins.html">插件</a></li>
      <li><a href="/#about">关于</a></li>
      <li><a href="contact.html">联系</a></li>
    </ul>
  </div>
</nav>

<div class="page">
  <a href="/" class="back-link">&larr; 返回主页</a>
  <h1 class="reveal">联系方式</h1>
  <p class="sub reveal">选择一个平台，点击查看详情</p>
  <p class="sub-hint reveal">
    <span class="dot"></span> 点击下方按钮
  </p>

  <div class="btn-list">
    <button class="contact-btn btn-stagger" data-platform="抖音" data-type="qr" data-img="抖音.png" data-text="打开抖音 App 扫码关注">
      <span class="indicator"></span>
      <span class="platform-badge">抖音</span>
      <span class="btn-label">抖音扫码关注</span>
      <span class="arrow">→</span>
    </button>
    <button class="contact-btn btn-stagger" data-platform="Email" data-type="text" data-text="hi@milulab.online" data-hint="欢迎邮件联系">
      <span class="indicator"></span>
      <span class="platform-badge">Email</span>
      <span class="btn-label">hi@milulab.online</span>
      <span class="arrow">→</span>
    </button>
    <button class="contact-btn btn-stagger" data-platform="小红书" data-type="text" data-text="@麋鹿" data-hint="小红书 App 搜索关注">
      <span class="indicator"></span>
      <span class="platform-badge">小红书</span>
      <span class="btn-label">@麋鹿</span>
      <span class="arrow">→</span>
    </button>
    <button class="contact-btn btn-stagger" data-platform="Bilibili" data-type="text" data-text="@麋鹿" data-hint="B站搜索关注">
      <span class="indicator"></span>
      <span class="platform-badge">Bilibili</span>
      <span class="btn-label">@麋鹿</span>
      <span class="arrow">→</span>
    </button>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="platform-label" id="modalPlatform"></div>
    <img id="modalImg" src="" alt="" style="display:none;">
    <div class="modal-text" id="modalText"></div>
    <div class="modal-hint" id="modalHint"></div>
    <button class="modal-close" id="modalClose">关闭</button>
  </div>
</div>

<footer>
  <span>© 2026 麋鹿</span>
  <span>milulab.online</span>
</footer>

<script>
  // ── Modal ──
  const modal = document.getElementById('modal');
  const modalPlatform = document.getElementById('modalPlatform');
  const modalImg = document.getElementById('modalImg');
  const modalText = document.getElementById('modalText');
  const modalHint = document.getElementById('modalHint');

  document.querySelectorAll('.contact-btn').forEach(btn => {
    // Ripple effect on click
    btn.addEventListener('click', function(e) {
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());

      // Open modal
      const platform = btn.dataset.platform;
      const type = btn.dataset.type;
      modalPlatform.textContent = platform;

      if (type === 'qr' && btn.dataset.img) {
        modalImg.src = btn.dataset.img;
        modalImg.style.display = 'block';
        modalText.textContent = btn.dataset.text;
        modalHint.textContent = '';
      } else {
        modalImg.style.display = 'none';
        modalText.textContent = btn.dataset.text;
        modalHint.textContent = btn.dataset.hint || '';
      }

      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  });

  function closeModal() {
    modal.classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  // ── Scroll reveal ──
  const revealObs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal, .btn-stagger').forEach(el => revealObs.observe(el));
</script>
</body>
</html>
