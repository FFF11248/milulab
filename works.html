<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品 · 麋鹿</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0C0C0C; --text: #C8C8C6; --text-dim: #6B6B68;
    --text-bright: #F5F5F3; --line: #1F1F1E; --line-light: #2A2A28;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; font-weight: 350;
    line-height: 1.6; letter-spacing: 0.01em;
  }
  body::after {
    content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 32px 56px;
  }
  .nav-inner { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; }
  .nav-logo { font-size: 15px; font-weight: 450; color: var(--text-bright); text-decoration: none; letter-spacing: 0.04em; }
  .nav-links { display: flex; gap: 40px; list-style: none; }
  .nav-links a { text-decoration: none; color: var(--text-dim); font-size: 14px; font-weight: 380; letter-spacing: 0.05em; transition: color 0.3s; }
  .nav-links a:hover { color: var(--text-bright); }

  .page { max-width: 1400px; margin: 0 auto; padding: 160px 56px 80px; }

  .back-link { font-size: 13px; color: var(--text-dim); text-decoration: none; display: inline-block; margin-bottom: 48px; transition: color 0.2s; }
  .back-link:hover { color: var(--text-bright); }

  h1 { font-size: clamp(40px, 5vw, 60px); font-weight: 300; color: var(--text-bright); line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 8px; }
  .sub { font-size: 14px; color: var(--text-dim); margin-bottom: 60px; }

  .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .g-item { position: relative; overflow: hidden; cursor: pointer; background: #141413; aspect-ratio: 1; }
  .g-item:nth-child(1) { grid-column: span 2; grid-row: span 2; }
  .g-item:nth-child(6) { grid-column: span 2; }
  .g-item img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.72) saturate(0.85); transition: transform 0.6s cubic-bezier(0.25,0.1,0.25,1), filter 0.6s; }
  .g-item img[src=""] { display: block; min-height: 100%; background: #1a1a18; }
  .g-item:hover img { transform: scale(1.03); filter: brightness(0.9) saturate(1); }
  .g-item:hover img[src=""] { filter: brightness(1.2); }
  .g-item-label { position: absolute; bottom: 16px; left: 16px; font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 0.05em; z-index: 2; transition: color 0.3s; }
  .g-item:hover .g-item-label { color: rgba(255,255,255,0.85); }

  footer { max-width: 1400px; margin: 0 auto; padding: 40px 56px 48px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 11px; color: #3D3D3B; }

  .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1), transform 0.8s cubic-bezier(0.16,1,0.3,1); }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  @media (max-width: 768px) {
    nav { padding: 20px 24px; }
    .nav-links { gap: 20px; }
    .nav-links a { font-size: 12px; }
    .page { padding: 120px 24px 60px; }
    .gallery-grid { grid-template-columns: 1fr 1fr; }
    .g-item:nth-child(1) { grid-column: span 2; grid-row: span 1; }
    .g-item:nth-child(6) { grid-column: span 1; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo">麋鹿</a>
    <ul class="nav-links">
      <li><a href="works.html">作品</a></li>
      <li><a href="plugins.html">插件</a></li>
      <li><a href="/#about">关于</a></li>
      <li><a href="contact.html">联系</a></li>
    </ul>
  </div>
</nav>

<div class="page">
  <a href="/" class="back-link">&larr; 返回主页</a>
  <h1 class="reveal">作品集</h1>
  <p class="sub reveal">自然光人像 · 风光 · 城市 · 近摄</p>
  <div class="gallery-grid reveal">
    <div class="g-item"><img src="" style="background:#1a1a18" loading="lazy"><span class="g-item-label">黄昏人像</span></div>
    <div class="g-item"><img src="" style="background:#1a1a18" loading="lazy"><span class="g-item-label">山野</span></div>
    <div class="g-item"><img src="" style="background:#1a1a18" loading="lazy"><span class="g-item-label">街拍</span></div>
    <div class="g-item"><img src="" style="background:#1a1a18" loading="lazy"><span class="g-item-label">细节</span></div>
    <div class="g-item"><img src="" style="background:#1a1a18" loading="lazy"><span class="g-item-label">森林</span></div>
    <div class="g-item"><img src="" style="background:#1a1a18" loading="lazy"><span class="g-item-label">海岸线</span></div>
    <div class="g-item"><img src="" style="background:#1a1a18" loading="lazy"><span class="g-item-label">建筑</span></div>
    <div class="g-item"><img src="" style="background:#1a1a18" loading="lazy"><span class="g-item-label">花</span></div>
    <div class="g-item"><img src="" style="background:#1a1a18" loading="lazy"><span class="g-item-label">日出</span></div>
    <div class="g-item"><img src="" style="background:#1a1a18" loading="lazy"><span class="g-item-label">雨天</span></div>
  </div>
</div>

<footer>
  <span>© 2026 麋鹿</span>
  <span>milulab.online</span>
</footer>

<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
</body>
</html>
