<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>插件 — 麋鹿的工具</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@12..72,400;12..72,500;12..72,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBFBFA;
    --surface: #FFFFFF;
    --text: #1a1a1a;
    --text-secondary: #787774;
    --text-tertiary: #9B9A97;
    --border: #EAEAEA;
    --tag-blue-bg: #E1F3FE;
    --tag-blue-text: #1F6C9F;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 20px 0;
    background: rgba(251,251,250,0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-logo {
    font-family: 'Newsreader', serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.01em;
    text-decoration: none;
  }

  .nav-links { display: flex; gap: 32px; list-style: none; }

  .nav-links a {
    text-decoration: none;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.02em;
    transition: color 0.3s ease;
  }

  .nav-links a:hover { color: var(--text); }

  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 160px 40px 80px;
  }

  .back-link {
    display: inline-block;
    font-size: 13px;
    color: var(--text-secondary);
    text-decoration: none;
    margin-bottom: 40px;
    transition: color 0.2s;
  }

  .back-link:hover { color: var(--text); }

  h1 {
    font-family: 'Newsreader', serif;
    font-size: clamp(40px, 5vw, 64px);
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 15px;
    color: var(--text-secondary);
    margin-bottom: 60px;
  }

  .plugins-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .plugin-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 36px 40px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .plugin-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 2px 16px rgba(0,0,0,0.03);
  }

  .plugin-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 3px 10px;
    border-radius: 9999px;
    margin-bottom: 16px;
  }

  .tag-ps { background: var(--tag-blue-bg); color: var(--tag-blue-text); }
  .tag-tool { background: #EDF3EC; color: #346538; }

  .plugin-card h3 {
    font-family: 'Newsreader', serif;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  .plugin-card p {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .plugin-dl {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .plugin-dl:hover {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }

  .plugin-dl svg {
    width: 14px; height: 14px;
    transition: transform 0.2s ease;
  }

  .plugin-dl:hover svg { transform: translateY(1px); }

  footer {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  footer span { font-size: 13px; color: var(--text-tertiary); }

  .fade-in {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1),
                transform 0.7s cubic-bezier(0.16,1,0.3,1);
  }

  .fade-in.visible { opacity: 1; transform: translateY(0); }
  .fade-in-delay-1 { transition-delay: 0.1s; }

  @media (max-width: 768px) {
    .nav-inner { padding: 0 20px; }
    .nav-links { gap: 20px; }
    .page { padding: 120px 20px 60px; }
    .plugins-grid { grid-template-columns: 1fr; }
    footer { padding: 30px 20px; flex-direction: column; gap: 12px; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">麋鹿</a>
    <ul class="nav-links">
      <li><a href="index.html">作品</a></li>
      <li><a href="plugins.html">插件</a></li>
      <li><a href="index.html#about">关于</a></li>
      <li><a href="index.html#contact">联系</a></li>
    </ul>
  </div>
</nav>

<div class="page">
  <a href="index.html" class="back-link">&larr; 返回主页</a>

  <h1 class="fade-in">工具与插件</h1>
  <p class="subtitle fade-in">自己做的实用小工具，提升后期效率。</p>

  <div class="plugins-grid">
    <div class="plugin-card fade-in">
      <span class="plugin-tag tag-ps">Photoshop 插件</span>
      <h3>QuickAIEdit</h3>
      <p>AI 选区生图插件，支持 CEP/UXP 双版本，速创 API 集成，一键生成高质量图像。</p>
      <a href="download.html?p=quickaiedit" target="_blank" class="plugin-dl">
        下载
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </a>
    </div>

    <div class="plugin-card fade-in fade-in-delay-1">
      <span class="plugin-tag tag-tool">独立工具</span>
      <h3>批量水印工具</h3>
      <p>拖拽即可为照片批量添加自定义水印，支持文字与图片水印，保持 EXIF 信息完整。</p>
      <a href="download.html?p=watermark" target="_blank" class="plugin-dl">
        下载
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </a>
    </div>
  </div>
</div>

<footer>
  <span>&copy; 2026 麋鹿</span>
  <span>All rights reserved.</span>
</footer>

<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
</script>

</body>
</html>
